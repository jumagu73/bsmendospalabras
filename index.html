<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSM · Dos palabras</title>
<style>
  :root{
    --bg:#0f0f13;
    --card:#1a1a22;
    --accent:#ff3d6e;
    --accent2:#3ddcff;
    --text:#f2f2f7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:2rem;
    background:radial-gradient(circle at 20% 20%, #1f1f2b, var(--bg) 60%);
    color:var(--text);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding:2rem;
    text-align:center;
  }
  h1{
    font-size:clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  h1 span{color:var(--accent);}
  .sub{opacity:.6; font-size:.95rem; margin-top:.4rem;}
  .cards{
    display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:center;
    width:100%; max-width:800px;
  }
  .card{
    flex:1 1 280px;
    min-height:200px;
    display:flex; align-items:center; justify-content:center;
    padding:2rem 1.5rem;
    background:var(--card);
    border-radius:24px;
    border:2px solid transparent;
    font-size:clamp(1.8rem, 5vw, 3rem);
    font-weight:800;
    text-transform:lowercase;
    letter-spacing:.02em;
    transition:transform .25s ease, border-color .25s ease;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,61,110,.15), rgba(61,220,255,.15));
    opacity:0; transition:opacity .3s;
  }
  .card:hover::before{opacity:1;}
  .card.pop{animation:pop .5s ease;}
  @keyframes pop{
    0%{transform:scale(.85); opacity:.3;}
    60%{transform:scale(1.05);}
    100%{transform:scale(1); opacity:1;}
  }
  .card:nth-child(1){border-color:var(--accent);}
  .card:nth-child(2){border-color:var(--accent2);}
  button{
    cursor:pointer;
    font-size:1.1rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:1rem 2.5rem;
    border:none;
    border-radius:999px;
    color:#0f0f13;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 30px rgba(255,61,110,.35);
  }
  button:hover{transform:translateY(-2px) scale(1.03);}
  button:active{transform:scale(.97);}
</style>
</head>
<body>

  <header>
    <h1>BSM <span>·</span> Dos palabras</h1>
    <p class="sub">Salen dos palabras al azar. El equipo se arregla para hablar de eso.</p>
  </header>

  <main class="cards">
    <div class="card" id="card1">—</div>
    <div class="card" id="card2">—</div>
  </main>

  <button id="btn">Tirar palabras</button>

<script>
  // 🔧 EDITÁ ESTAS LISTAS: cuantas más palabras, más variedad
  const PALABRAS = [
    "amor", "miedo", "dinero", "poder", "tiempo", "soledad", "familia",
    "muerte", "éxito", "fracaso", "amistad", "trabajo", "política", "fútbol",
    "música", "viaje", "comida", "dios", "suerte", "culpa", "vergüenza",
    "libertad", "orden", "caos", "mentira", "memoria", "desire", "cuerpo",
    "tecnología", "redes", "fama", "celos", "perdón", "ira", "aburrimiento",
    "identidad", "rutina", "silencio", "fuego", "agua", "ciudad", "campo",
    "infancia", "vejez", "sueño", "insomnio", "azar", "destino", "moda",
    "guerra", "paz", "salud", "envidia", "orgullo", "humildad", "risa",
    "llanto", "esperanza", "nostalgia", "duda", "fe", "secreto", "chisme"
  ];

  const card1 = document.getElementById("card1");
  const card2 = document.getElementById("card2");
  const btn = document.getElementById("btn");

  let ultimas = [];

  function tirarPalabras(){
    if(PALABRAS.length < 2){
      alert("Necesitás al menos 2 palabras en la lista.");
      return;
    }
    const copia = [...PALABRAS];
    for(let i = copia.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    let par = copia.slice(0, 2);

    // Evita repetir exactamente el mismo par que la vez anterior
    if(ultimas.length === 2 &&
       par.includes(ultimas[0]) && par.includes(ultimas[1])){
      par = copia.slice(2, 4);
    }
    ultimas = par;

    [card1, card2].forEach(c => c.classList.remove("pop"));
    void card1.offsetWidth;

    card1.textContent = par[0];
    card2.textContent = par[1];
    card1.classList.add("pop");
    card2.classList.add("pop");
  }

  btn.addEventListener("click", tirarPalabras);
  tirarPalabras();
</script>

</body>
</html>
